name: Internship Finder

on:
  schedule:
    # Morocco is UTC+1 (except during Ramadan)
    # 16:00 Morocco = 15:00 UTC
    - cron: "0 15 * * *"
    # 20:00 Morocco = 19:00 UTC
    - cron: "0 19 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: internship-finder
  cancel-in-progress: false

jobs:
  find-internships:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run internship finder
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          # DEBUG: "1" # Uncomment to enable debug mode and upload debug_jobs.json
        run: python scraper.py

      - name: Upload logs and debug data
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: internship-finder-artifacts
          path: |
            internship_finder.log
            debug_jobs.json
          if-no-files-found: ignore

      - name: Persist seen jobs
        run: |
          if [ -f seen_jobs.json ]; then
            if git diff --quiet -- seen_jobs.json; then
              echo "No seen_jobs.json changes to commit."
            else
              git config user.name "github-actions[bot]"
              git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
              git add seen_jobs.json
              git commit -m "Update seen internship jobs [skip ci]"
              git pull --rebase
              git push
            fi
          fi
