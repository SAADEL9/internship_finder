# Internship Finder configuration
#
# Source kinds:
#   generic         JSON-LD (schema.org JobPosting) + CSS card heuristics
#   wordpress       WP listing articles (dreamjob.ma family)
#   rekrute         rekrute.com offer links
#   marocannonces   marocannonces.com listing rows
#   talent          ma.talent.com SSR cards
#   successfactors  SAP SuccessFactors job lists (/JobDetail/ links)
#   rss             RSS/Atom feed
#
# A source with `search_url` (containing {query}) is fetched once per query;
# a source with a static `url` is fetched exactly once per run.

search:
  max_age_days: 14
  priority_hours: 24
  max_results_per_run: 40
  request_timeout_seconds: 25
  max_workers: 8
  politeness_delay_seconds: 0.6
  state_retention_days: 90
  user_agent: "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36"

filters:
  locations:
    - casablanca
    - casa
    - morocco
    - maroc
    - remote morocco
    - remote maroc
    - hybride casablanca
    - hybrid casablanca
  internship_terms:
    - stage
    - stage pfe
    - internship
    - intern
    - stagiaire
    - pfe
  # Title-level exclusions: a job whose TITLE matches one of these is dropped
  # unless the title itself also contains an internship term.
  exclude_title_terms:
    - senior
    - manager
    - directeur
    - directrice
    - architecte
    - commercial
    - marketing
    - comptable
    - juriste
  skills:
    # Languages
    - Java
    - JavaScript
    - TypeScript
    - Python
    - C#
    - C++
    - PHP
    # Backend
    - Spring
    - Spring Boot
    - Node.js
    - Express
    - NestJS
    - .NET
    - Django
    - Laravel
    # Frontend
    - Angular
    - React
    - Next.js
    - Vue.js
    # DevOps
    - Docker
    - Kubernetes
    - Jenkins
    - GitLab CI
    - GitHub Actions
    - CI/CD
    # Cloud
    - AWS
    - Azure
    - Google Cloud
    # Databases
    - PostgreSQL
    - MySQL
    - MongoDB
    - Oracle
    # General SWE
    - Full Stack
    - Backend
    - Frontend
    - Software Engineer
    - Software Developer
    - Génie logiciel
    - Génie informatique
    - Développeur
    - Developer

queries:
  - "stage informatique"
  - "stage pfe informatique"
  - "stage fin d'études informatique"
  - "stage développeur"
  - "stage ingénieur informatique"
  - "stagiaire informatique"
  - "stage java"
  - "stage react"
  - "stage full stack"
  - "stage devops"
  - "stage data"
  - "stage web"
  - "stage cybersécurité"
  - "software engineer internship"

sources:
  # ---- verified working (server-rendered, selectors tested) ----
  dreamjob:
    enabled: true
    kind: wordpress
    search_url: "https://www.dreamjob.ma/?s={query}"
    default_location: "Morocco"

  rekrute:
    enabled: true
    kind: rekrute
    search_url: "https://www.rekrute.com/offres.html?st=d&keywordNew=1&jobLocation=RK&keyword={query}"
    default_location: "Morocco"

  talent:
    enabled: true
    kind: talent
    search_url: "https://ma.talent.com/jobs?k={query}&l=Casablanca"
    default_location: "Casablanca, Morocco"

  deloitte:
    enabled: true
    kind: successfactors
    search_url: "https://apply.deloitte.com/en_US/careers/SearchJobs/?listFilterMode=1&jobRecordsPerPage=20&keyword={query}"
    company: "Deloitte"
    default_location: "Global"
    queries:
      - "stage maroc"
      - "intern morocco"

  # ---- blocked locally by Cloudflare (HTTP 403) but reachable from other
  #      networks (e.g. GitHub Actions runners); kept enabled, failures tolerated ----
  emploi_ma:
    enabled: true
    kind: generic
    search_url: "https://www.emploi.ma/recherche-jobs-maroc?f%5B0%5D=im_field_offre_region%3A76&keys={query}"
    default_location: "Morocco"
    tolerate_failure: true
    queries:
      - "stage informatique"
      - "stage pfe"
      - "stage développeur"
      - "stagiaire informatique"

  emploi_ma_rss:
    enabled: true
    kind: rss
    url: "https://www.emploi.ma/rss.xml"
    default_location: "Morocco"
    tolerate_failure: true
