search:
  max_age_days: 14
  priority_hours: 24
  max_results_per_run: 40
  request_timeout_seconds: 25
  user_agent: "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36"

filters:
  locations:
    - casablanca
    - casa
    - morocco
    - maroc
    - remote morocco
    - remote maroc
    - hybride casablanca
    - hybrid casablanca
  internship_terms:
    - stage
    - stage pfe
    - internship
    - intern
    - stagiaire
    - pfe
  skills:

  # Languages
  - Java
  - JavaScript
  - TypeScript
  - Python
  - C#
  - C++
  - PHP

  # Backend
  - Spring
  - Spring Boot
  - Node.js
  - Express
  - NestJS
  - .NET
  - Django
  - Laravel

  # Frontend
  - Angular
  - React
  - Next.js
  - Vue.js

  # DevOps
  - Docker
  - Kubernetes
  - Jenkins
  - GitLab CI
  - GitHub Actions
  - CI/CD

  # Cloud
  - AWS
  - Azure
  - Google Cloud
  - Cloud

  # Databases
  - PostgreSQL
  - MySQL
  - MongoDB
  - Oracle

  # General
  - Full Stack
  - Backend
  - Frontend
  - Software Engineer
  - Software Developer
  - Génie logiciel
  - Génie informatique
  - Développeur
  - Developer

queries:

  # General
  - "stage pfe informatique casablanca"
  - "stage fin études informatique casablanca"
  - "stage fin d'études informatique casablanca"
  - "stage développeur casablanca"
  - "stage développement logiciel casablanca"
  - "stage ingénieur informatique casablanca"
  - "stage ingénieur logiciel casablanca"
  - "stage pré embauche informatique casablanca"

  # Backend
  - "stage développeur Java casablanca"
  - "stage Java Spring Boot casablanca"
  - "stage backend Java casablanca"
  - "stage backend Node.js casablanca"

  # Frontend
  - "stage développeur frontend casablanca"
  - "stage React casablanca"
  - "stage Angular casablanca"
  - "stage Next.js casablanca"

  # Full stack
  - "stage full stack casablanca"
  - "stage développeur full stack casablanca"

  # DevOps / Cloud
  - "stage DevOps casablanca"
  - "stage Docker Kubernetes casablanca"
  - "stage cloud computing casablanca"
  - "stage AWS casablanca"
  - "stage Azure casablanca"

  # English
  - "software engineer internship Casablanca"
  - "software developer internship Casablanca"
  - "backend developer internship Casablanca"
  - "frontend developer internship Casablanca"
  - "full stack developer internship Casablanca"
  - "DevOps internship Casablanca"

