search:
  max_age_days: 14
  priority_hours: 24
  max_results_per_run: 25
  request_timeout_seconds: 20
  user_agent: "Mozilla/5.0 (compatible; InternshipFinder/1.0; +https://github.com/)"

filters:
  locations:
    - casablanca
    - casa
    - morocco
    - maroc
    - remote morocco
    - remote maroc
    - hybride casablanca
    - hybrid casablanca
  internship_terms:
    - stage
    - stage pfe
    - internship
    - intern
    - stagiaire
    - pfe
  skills:
    - Next.js
    - React
    - TypeScript
    - Node.js
    - Java
    - Spring Boot
    - DevOps
    - Docker
    - Kubernetes
    - Cloud
    - Full Stack
    - Backend
    - Frontend
    - Software Engineer
    - Software Engineering
    - Genie Logiciel
    - Developpeur
    - Developer

queries:
  - "stage pfe software engineer casablanca"
  - "stage pfe developpeur casablanca"
  - "internship software engineering casablanca morocco"
  - "stage react next.js casablanca"
  - "stage java spring boot casablanca"
  - "stage devops docker kubernetes casablanca"
  - "stage full stack casablanca"
  - "stage backend frontend casablanca"
  - "remote morocco software engineering internship"

